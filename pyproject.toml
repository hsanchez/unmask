[project]
name = "unmask"
version = "0.1.0"
description = "Neuro-symbolic AI specification bug detection"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "Flask>=3.1",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0",
  "z3-solver==4.15.3.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.52"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]

[project.scripts]
unmask = "unmask.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unmask"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/unmask"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.14"
reportMissingTypeStubs = false
allowedUntypedLibraries = ["z3"]

[dependency-groups]
dev = [
  "dotagents",
  "mypy>=1.13",
  "prek>=0.4.13",
  "pytest>=8.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[tool.ruff.lint.isort]
known-first-party = ["unmask"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff]
indent-width = 2
extend-exclude = [".agents", ".claude", ".codex", ".gemini", ".github"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.uv.sources]
dotagents = { path = "/Users/huascar/dev/github.com/hsanchez/dotagents" }
