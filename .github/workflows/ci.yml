name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint and type checks
        run: uv run prek run --all-files
      - name: Python tests
        run: uv run pytest -W error
      - name: Frontend tests
        run: node --test tests/frontend/*.test.cjs
      - name: Build source and wheel distributions
        run: uv build
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/unmask-smoke"
          smoke_python="$RUNNER_TEMP/unmask-smoke/bin/python"
          uv pip install --python "$smoke_python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/unmask-smoke/bin/unmask" --help
          "$smoke_python" -c 'from importlib.resources import files; import unmask; from unmask.benchmarks import Adherence; from unmask.benches import IFBench; case = unmask.VerificationCase.from_json(files("unmask").joinpath("web/samples/judge-audit.json").read_text(encoding="utf-8")); result = unmask.adherence(case); print(result.overall); raise SystemExit(result.overall != "SATISFIED")'
